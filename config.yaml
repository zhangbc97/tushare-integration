# Tushare API配置
tushare_token: "" # 必填，可通过环境变量 TUSHARE_TOKEN 设置
tushare_url: "https://api.tushare.pro"
tushare_point: 2000 # 默认积分
tushare_max_concurrent_requests: null # 不指定时会根据积分自动计算

# 数据库配置
database:
  drivername: "clickhouse+http" # 必填，可通过环境变量 DB_DRIVER 设置
  host: "127.0.0.1" # 必填，可通过环境变量 DB_HOST 设置
  port: 8123 # 必填，可通过环境变量 DB_PORT 设置
  user: "default" # 必填，可通过环境变量 DB_USER 设置
  password: "" # 可选，可通过环境变量 DB_PASSWORD 设置
  db_name: "default" # 必填，可通过环境变量 DB_NAME 设置
  template_params: {} # 可选，SQL模板参数

# 报告配置
reporters: [] # 可选，报告模块列表
# - "tushare_integration.reporters.FeishuWebHookReporter"
feishu_webhook: "" # 可选，可通过环境变量 FEISHU_WEBHOOK 设置

# 爬虫配置
parallel_mode: false # 可选，是否开启并行模式
batch_id: "" # 可选，可通过环境变量 BATCH_ID 设置
concurrent_spiders: 1 # 可选，可通过环境变量 CONCURRENT_SPIDERS 设置

# 请求配置
download_delay: 0.0 # 可选，下载延迟
max_requests_per_minute: 60 # 可选，每分钟最大请求数
retry_enabled: true # 可选，是否开启重试
retry_times: 10 # 可选，重试次数
retry_delay: 10 # 可选，重试延迟(秒)

# HTTP配置
timeout: 30 # 可选，请求超时时间(秒)
headers: # 可选，请求头
  User-Agent: "tushare-integration"

