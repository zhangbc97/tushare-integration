# Tushare API配置
tushare_token: "" # 必填，可通过环境变量 TUSHARE_TOKEN 设置
tushare_url: "https://api.tushare.pro"
tushare_point: 10000 # 默认积分

# 日志配置
log_level: "INFO" # 可选，日志级别(DEBUG/INFO/WARNING/ERROR)，可通过环境变量 LOG_LEVEL 设置

# 数据库配置
database:
  drivername: "duckdb" # 必填，可通过环境变量 DB_DRIVER 设置
  host: "tushare.db" # 必填，可通过环境变量 DB_HOST 设置, DuckDB 为文件路径
  port: 0 # 必填，可通过环境变量 DB_PORT 设置 DuckDB 端口号写0
  user: "default" # 必填，可通过环境变量 DB_USER 设置
  password: "" # 可选，可通过环境变量 DB_PASSWORD 设置
  database: "default" # 必填，可通过环境变量 DB_NAME 设置 DuckDB该字段无效
  query: {} # 可选，连接参数

# 报告配置
reporters: [] # 可选，报告模块列表
# - "tushare_integration.reporters.FeishuWebHookReporter"
feishu_webhook: "" # 可选，可通过环境变量 FEISHU_WEBHOOK 设置

# 爬虫配置
parallel_mode: false # 可选，是否开启并行模式
batch_id: "" # 可选，可通过环境变量 BATCH_ID 设置

concurrent_spiders: 1 # 可选，可通过环境变量 CONCURRENT_SPIDERS 设置
max_workers_per_spider: 10 # 可选，每个爬虫最大工作线程数
max_requests_per_minute: 500 # 可选，每分钟最大请求数

retry_enabled: true # 可选，是否开启重试
retry_times: 10 # 可选，重试次数
retry_delay: 10 # 可选，重试延迟(秒)

# HTTP配置
timeout: 30 # 可选，请求超时时间(秒)

cache:
  enable: true # 可选，是否开启缓存
  batch_size: 100000 # 可选，缓存批量大小，当超过该值时写入远程数据库
