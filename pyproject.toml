[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tushare-integration"
dynamic = ["version"]
description = "Tushare Pro数据集成工具，支持将Tushare数据同步到本地数据库"
authors = [{ "name" = "zhangbingchen", "email" = "1731259685@qq.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["tushare", "finance", "data", "integration", "financial-data"]
classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Developers",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3.11",
"Topic :: Software Development :: Libraries :: Python Modules",
"Topic :: Office/Business :: Financial",
]
dependencies = [
"clickhouse-connect>=0.8.15",
"cryptography>=44.0.0",
"jinja2>=3.1.5",
"lz4>=4.4.3",
"numpy>=2.2.2",
"pandas>=2.2.3",
"pyarrow>=19.0.0",
"pydantic-settings>=2.7.1",
"pydantic>=2.10.6",
"python-dateutil>=2.9.0",
"pyyaml>=6.0.1",
"requests>=2.32.3",
"rich>=13.9.4",
"setuptools>=75.8.0",
"sqlalchemy>=2.0.37",
"typer>=0.15.1",
"typing-extensions>=4.12.2",
"zstandard>=0.23.0",
"httpx>=0.21.0",
]

[project.scripts]
tushare-integration = "tushare_integration:main"

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.8.15", "clickhouse-sqlalchemy>=0.3.2"]
mysql = ["pymysql>=1.1.1"]
doris = ["doris-alchemy>=0.2.8"]
starrocks = ["starrocks>=1.2.0"]
databend = ["databend-sqlalchemy>=0.5.0"]
duckdb = ["duckdb-engine>=0.15.0"]
all = [
"clickhouse-connect>=0.8.15",
"clickhouse-sqlalchemy>=0.3.2",
"pymysql>=1.1.1",
"doris-alchemy>=0.2.8",
"starrocks>=1.2.0",
"databend-sqlalchemy>=0.5.0",
"duckdb-engine>=0.15.0"
]
dev = ["pytest>=7.0", "black", "isort", "build", "twine"]

[tool.setuptools.dynamic]
version = { attr = "tushare_integration.__version__" }

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 120
profile = "black"

[tool.pytest.ini_options]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = ["ignore::pydantic.PydanticDeprecatedSince20"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "scripts", "scripts.*", "docs", "docs.*"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
